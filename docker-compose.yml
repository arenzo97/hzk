services:
  backend:
    build:
      context: ./backend
    container_name: jlwc-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: church
      DB_USERNAME: postgres
      DB_PASSWORD: secret
    depends_on:
      - db
    command: php artisan serve --host=0.0.0.0 --port=8000

  db:
    image: postgres:13-alpine
    container_name: jlwc-db
    environment:
      POSTGRES_DB: church
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
