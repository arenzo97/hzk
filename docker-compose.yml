services:
  backend:
    build:
      context: ./backend
    container_name: jlwc-backend
    expose:
      - "9000"
    volumes:
      - ./backend:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: church
      DB_USERNAME: postgres
      DB_PASSWORD: secret
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    container_name: jlwc-frontend
    ports:
      - "4321:4321"
    volumes:
      - ./frontend:/app
    command: ["npm", "run", "dev", "--", "--host"]
    depends_on:
      - backend

  db:
    image: postgres:13-alpine
    container_name: jlwc-db
    environment:
      POSTGRES_DB: church
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    image: nginx:stable
    container_name: jlwc-web
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./backend/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend


volumes:
  postgres_data:
